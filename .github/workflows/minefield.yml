name: Generate Contribution Minefield

on:
schedule:
- cron: "0 */12 * * *"
workflow_dispatch:

permissions:
contents: write

jobs:
generate:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Generate Minefield Grid
    run: |
      mkdir -p dist

      cat > dist/minefield.svg << 'EOF'
      <svg xmlns="http://www.w3.org/2000/svg"
           width="900"
           height="180"
           viewBox="0 0 900 180">

      <rect width="100%" height="100%" fill="#0d1117"/>

      <style>
        .safe{
          fill:#2ea043;
          rx:3;
          animation:pulse 3s infinite alternate;
        }

        .bomb{
          font-size:14px;
          animation:explode 8s infinite;
        }

        .title{
          fill:#58a6ff;
          font:600 20px Segoe UI;
        }

        @keyframes pulse{
          from{opacity:.45}
          to{opacity:1}
        }

        @keyframes explode{
          0%,70%{opacity:0}
          80%,100%{opacity:1}
        }
      </style>

      <!-- contribution style rows -->

      <!-- week row 1 -->
      <rect x="20" y="30" width="12" height="12" class="safe"/>
      <rect x="38" y="30" width="12" height="12" class="safe"/>
      <rect x="56" y="30" width="12" height="12" class="safe"/>
      <text x="58" y="40" class="bomb">💣</text>
      <rect x="74" y="30" width="12" height="12" class="safe"/>
      <rect x="92" y="30" width="12" height="12" class="safe"/>
      <rect x="110" y="30" width="12" height="12" class="safe"/>

      <!-- row 2 -->
      <rect x="20" y="48" width="12" height="12" class="safe"/>
      <rect x="38" y="48" width="12" height="12" class="safe"/>
      <text x="40" y="58" class="bomb">💥</text>
      <rect x="56" y="48" width="12" height="12" class="safe"/>
      <rect x="74" y="48" width="12" height="12" class="safe"/>
      <rect x="92" y="48" width="12" height="12" class="safe"/>

      <!-- repeat until heatmap width -->

      <text x="20" y="150" class="title">
      💣 Minefield Contributions — Avoid the explosion.
      </text>

      </svg>
      EOF

  - name: Deploy
    uses: peaceiris/actions-gh-pages@v4
    with:
      github_token: ${{ secrets.GITHUB_TOKEN }}
      publish_dir: ./dist
      publish_branch: output
