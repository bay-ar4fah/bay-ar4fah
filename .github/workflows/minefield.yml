```
permissions:
  contents: write

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Generate Minefield SVG
    run: |
      mkdir -p dist
      cat > dist/minefield.svg << 'EOF'
      <svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180">
      <rect width="100%" height="100%" fill="#0d1117"/>

      <style>
        .tile { fill:#8be28b; rx:5; animation: reveal 6s infinite; }
        .bomb { fill:#ff4d4d; animation: explode 6s infinite; }
        .safe { fill:#7ee787; animation: reveal 6s infinite; }

        @keyframes reveal {
          0% { opacity:0.15; }
          30% { opacity:1; }
          100% { opacity:1; }
        }

        @keyframes explode {
          0%,70% { opacity:0; }
          80% { opacity:1; }
          100% { opacity:1; }
        }
      </style>

      <!-- tiles -->
      <rect x="40" y="40" width="35" height="35" class="safe"/>
      <rect x="85" y="40" width="35" height="35" class="safe"/>
      <rect x="130" y="40" width="35" height="35" class="bomb"/>
      <text x="138" y="65" font-size="18">💥</text>

      <rect x="175" y="40" width="35" height="35" class="safe"/>
      <rect x="220" y="40" width="35" height="35" class="safe"/>

      <text x="40" y="130" fill="#58a6ff"
      font-size="24">💣 Minefield Activity — Choose wisely.</text>
      </svg>
      EOF

  - name: Deploy
    uses: peaceiris/actions-gh-pages@v4
    with:
      github_token: ${{ secrets.GITHUB_TOKEN }}
      publish_dir: ./dist
      publish_branch: output
