name: Generate Minefield Contribution

on:
schedule:
- cron: "0 */12 * * *"
workflow_dispatch:

permissions:
contents: write

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Generate Minefield SVG
    run: |
      mkdir -p dist

      cat > dist/minefield.svg << 'EOF'
      <svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">

      <rect width="100%" height="100%" fill="#0d1117"/>

      <style>
      .tile{
        fill:#2ea043;
        rx:4;
        animation: reveal 5s infinite alternate;
      }

      .bomb{
        animation: explode 7s infinite;
      }

      .txt{
        fill:#58a6ff;
        font-size:22px;
        font-family:Segoe UI;
      }

      @keyframes reveal{
        0%{opacity:.35}
        100%{opacity:1}
      }

      @keyframes explode{
        0%,70%{opacity:0}
        80%,100%{opacity:1}
      }
      </style>

      <!-- Minefield grid -->
      <rect x="50" y="40" width="28" height="28" class="tile"/>
      <rect x="85" y="40" width="28" height="28" class="tile"/>
      <rect x="120" y="40" width="28" height="28" class="tile"/>
      <text x="122" y="62" class="bomb">💣</text>

      <rect x="155" y="40" width="28" height="28" class="tile"/>
      <rect x="190" y="40" width="28" height="28" class="tile"/>
      <rect x="225" y="40" width="28" height="28" class="tile"/>

      <rect x="50" y="75" width="28" height="28" class="tile"/>
      <rect x="85" y="75" width="28" height="28" class="tile"/>
      <text x="88" y="98" class="bomb">💥</text>

      <rect x="120" y="75" width="28" height="28" class="tile"/>
      <rect x="155" y="75" width="28" height="28" class="tile"/>
      <rect x="190" y="75" width="28" height="28" class="tile"/>
      <text x="193" y="98" class="bomb">💣</text>

      <text x="50" y="170" class="txt">
      💣 Minefield Contribution — Some tiles explode.
      </text>

      </svg>
      EOF

  - name: Deploy
    uses: peaceiris/actions-gh-pages@v4
    with:
      github_token: ${{ secrets.GITHUB_TOKEN }}
      publish_dir: ./dist
      publish_branch: output
